<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bounda Labs — independent app development. Contact us for app support and enquiries.">
  <title>Bounda Labs</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172a32; background: #f5f7f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; }
    main { flex: 1; display: grid; place-items: center; padding: 64px 24px; }
    section { width: 100%; max-width: 660px; }
    .mark { width: 48px; height: 5px; background: #267566; border-radius: 3px; margin-bottom: 32px; }
    h1 { font-size: clamp(48px, 10vw, 80px); letter-spacing: -0.055em; line-height: 1.05; margin: 0 0 24px; font-weight: 650; }
    .intro { font-size: clamp(20px, 4vw, 26px); line-height: 1.5; color: #52636a; margin: 0 0 48px; }
    h2 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
    .support { color: #52636a; line-height: 1.6; margin: 0 0 12px; }
    a { color: #165e50; text-underline-offset: 5px; overflow-wrap: anywhere; }
    a:hover { color: #103e35; }
    a:focus-visible { outline: 3px solid #267566; outline-offset: 6px; border-radius: 2px; }
    .email { font-size: 20px; }
    footer { padding: 24px; text-align: center; font-size: 13px; color: #65757b; }
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="brand">
      <div class="mark" aria-hidden="true"></div>
      <h1 id="brand">Bounda Labs</h1>
      <p class="intro">Independent app development.</p>
      <h2>Contact &amp; support</h2>
      <p class="support">For app support, feedback or general enquiries, get in touch.</p>
      <a class="email" href="mailto:support@boundalabs.uk">support@boundalabs.uk</a>
    </section>
  </main>
  <footer>&copy; 2026 Bounda Labs</footer>
</body>
</html>
